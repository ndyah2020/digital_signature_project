services:
  db:
    image: postgres:17-alpine
    container_name: digital-signature-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/dabase.sql:/docker-entrypoint-initdb.d/01_init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    container_name: digital-signature-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # ──────────────────────────────────────────────
  # Frontend – React / Vite (served by Nginx)
  # ──────────────────────────────────────────────
  frontend:
    container_name: digital-signature-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_API_URL rỗng → Axios dùng relative URL → nginx proxy đến backend:5000
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
  uploads_data:
